<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Madhupur Tract above a buried fault</title>
<desc>Cross-section: an uplifted red-clay plateau, the Madhupur Tract, beside a flat grey river floodplain, with the fault hidden deep underground and a note that only the landscape is visible.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1f18"/><stop offset="1" stop-color="#14301f"/></linearGradient></defs>
<rect width="900" height="470" fill="url(#bg)"/>
<!-- floodplain (left) and tract (right) -->
<polygon points="0,260 380,260 430,200 900,200 900,470 0,470" fill="#4b5a63"/>
<polygon points="430,200 900,200 900,260 480,260" fill="#c4553a"/>
<polygon points="380,260 480,260 430,200" fill="#c4553a"/>
<polygon points="0,260 380,260 390,274 0,274" fill="#7f95a3"/>
<!-- river -->
<path d="M0 262 Q120 250 240 262 T380 262" stroke="#6fc3ff" stroke-width="7" fill="none"/>
<!-- sal trees -->
<g fill="#37a35b"><circle cx="560" cy="180" r="16"/><circle cx="610" cy="172" r="19"/><circle cx="665" cy="180" r="16"/><circle cx="725" cy="174" r="18"/><circle cx="790" cy="180" r="16"/></g>
<g stroke="#5b3a22" stroke-width="5"><path d="M560 196v8M610 191v13M665 196v8M725 192v12M790 196v8"/></g>
<!-- hidden fault -->
<path d="M400 290 470 470" stroke="#ffd23f" stroke-width="5" stroke-dasharray="12 8" fill="none"/>
<g font-size="16" fill="#ecf5ee" text-anchor="middle">
<text x="190" y="235">flat floodplain</text><text x="680" y="135">red-clay Madhupur Tract</text>
<text x="260" y="395" fill="#ffd23f">fault: deep underground, not visible</text></g>
<path d="M420 205 400 250" stroke="#ecf5ee" stroke-width="3" fill="none"/>
<text x="440" y="190" font-size="14" fill="#ecf5ee">edge of the tract</text>
</svg>
