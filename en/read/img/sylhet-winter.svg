<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Why Sylhet is warmer in winter</title>
<desc>Cross-section: cold winter wind blows from the north and is blocked by the Meghalaya hills, while a fog blanket over Sylhet keeps the night warmer than the dry, exposed northern plains.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1033"/><stop offset="1" stop-color="#1c1a4a"/></linearGradient></defs>
<rect width="900" height="470" fill="url(#bg)"/>
<g fill="#fff" opacity=".8"><circle cx="80" cy="50" r="2"/><circle cx="200" cy="90" r="2"/><circle cx="330" cy="40" r="2"/><circle cx="470" cy="75" r="2"/><circle cx="560" cy="35" r="2"/><circle cx="820" cy="60" r="2"/></g>
<circle cx="760" cy="70" r="26" fill="#f3e9c6"/><circle cx="772" cy="64" r="24" fill="#0e1033"/>
<!-- ground -->
<polygon points="0,380 300,380 380,230 430,200 480,235 540,380 900,380 900,470 0,470" fill="#3b4a3c"/>
<polygon points="0,380 300,380 300,392 0,392" fill="#4f6b55"/>
<!-- fog blanket over Sylhet (right) -->
<g fill="#cfe3ee" opacity=".75"><ellipse cx="640" cy="360" rx="100" ry="18"/><ellipse cx="780" cy="352" rx="100" ry="20"/><ellipse cx="700" cy="335" rx="90" ry="14"/></g>
<!-- cold wind from north (left) blocked by hills -->
<g stroke="#7fc8ff" stroke-width="6" fill="none" stroke-linecap="round">
<path d="M60 300 C140 295, 220 300, 300 296"/><path d="M60 340 C140 335, 220 340, 290 336"/>
<path d="M300 296 l-16 -10 m16 10 l-16 10" stroke-width="5"/></g>
<!-- warmth -->
<g stroke="#ffb454" stroke-width="5" fill="none" stroke-linecap="round"><path d="M650 430c-10-10 10-18 0-28M700 430c-10-10 10-18 0-28M750 430c-10-10 10-18 0-28"/></g>
<g font-size="16" text-anchor="middle" fill="#e8ecff">
<text x="160" y="270" fill="#7fc8ff">cold wind from the north</text><text x="160" y="291" font-size="13" fill="#7fc8ff">exposed plains cool fast</text>
<text x="430" y="180">Meghalaya hills</text><text x="430" y="200" font-size="13" fill="#b6bdf0">block cold air</text>
<text x="715" y="305" fill="#ffd9a0">fog blanket traps warmth</text><text x="715" y="458" fill="#ffb454">Sylhet</text></g>
</svg>
