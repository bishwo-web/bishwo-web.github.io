<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<title>Plates around Turkey</title>
<desc>Schematic of the Eurasian, African and Arabian plates squeezing the small Anatolian plate westward, with the North and East Anatolian faults marked.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061a24"/><stop offset="1" stop-color="#0b2a30"/></linearGradient></defs>
<rect width="900" height="470" fill="url(#bg)"/>
<g stroke="#0b2a30" stroke-width="4">
<polygon points="0,0 900,0 900,150 640,175 470,150 300,185 0,160" fill="#2f7fd1"/>
<polygon points="0,160 300,185 470,150 640,175 640,260 520,300 300,255 0,290" fill="#f2c14e"/>
<polygon points="0,290 300,255 520,300 640,260 640,470 0,470" fill="#34c38f"/>
<polygon points="640,175 900,150 900,470 640,470 640,260" fill="#e4572e"/>
</g>
<g font-size="19" font-weight="700" fill="#061a24" text-anchor="middle">
<text x="450" y="75">EURASIAN PLATE</text><text x="300" y="400">AFRICAN PLATE</text><text x="780" y="330">ARABIAN PLATE</text>
<text x="400" y="232" font-size="17">ANATOLIAN</text></g>
<path d="M130 215 100 215m16-12-16 12 16 12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M300 185 470 150 640 175" stroke="#ff4d6d" stroke-width="5" fill="none" stroke-dasharray="10 6"/>
<path d="M640 175 640 260" stroke="#ff4d6d" stroke-width="5" fill="none" stroke-dasharray="10 6"/>
<g font-size="14" fill="#fff"><text x="330" y="140">North Anatolian Fault</text><text x="652" y="222">East Anatolian Fault</text></g>
</svg>
