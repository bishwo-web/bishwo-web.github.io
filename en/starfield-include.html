<!-- Site-wide starfield (same animation as statmania.info). Adds a fixed canvas behind the page. -->
<canvas class="sm-canvas" aria-hidden="true"></canvas>
<script>
(function () {
  document.querySelectorAll('canvas.sm-canvas, #sm-canvas').forEach(function (canvas) {
    if (!canvas.getContext) return;
    var ctx = canvas.getContext('2d'), W, H, dpr, particles = [];
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var local = canvas.id === 'sm-canvas';           // hero canvas fills its wrapper, not the viewport
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = local ? canvas.parentElement.clientWidth : window.innerWidth;
      H = local ? canvas.parentElement.clientHeight : window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function init() {
      var count = local ? Math.min(70, Math.floor((W || 1200) / 18)) : Math.min(80, Math.floor((W || 1200) / 24));
      particles = [];
      for (var i = 0; i < count; i++) particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.6 + 0.6 });
    }
    function step() {
      ctx.clearRect(0, 0, W, H);
      var maxDist = local ? 130 : 120;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        for (var j = i + 1; j < particles.length; j++) {
          var q = particles[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.sqrt(dx * dx + dy * dy);
          if (d < maxDist) {
            ctx.strokeStyle = 'rgba(0,229,255,' + (0.16 * (1 - d / maxDist)) + ')';
            ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
      }
      for (var k = 0; k < particles.length; k++) {
        var pt = particles[k];
        ctx.beginPath(); ctx.fillStyle = 'rgba(180,225,255,0.85)';
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!reduceMotion) requestAnimationFrame(step);
    }
    resize(); init(); step();
    window.addEventListener('resize', function () { resize(); init(); });
  });
})();
</script>
